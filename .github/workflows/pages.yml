name: Deploy static site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check content architecture
        run: node --test tests/architecture.test.mjs

      - name: Generate content catalog
        run: |
          node scripts/generate-posts.js
          node scripts/check-site.js

      - name: Build public site
        run: node scripts/build-site.js "$RUNNER_TEMP/site"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
